        run: npm run test:wave3a -- --test-name-pattern='^W2 AT-4\.4 ' test/wave2/at4.test.ts
      - name: UX-27 done block on the lesson page
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^UX-27 ' test/wave2/at4.test.ts
      - name: UX-28 ticks and done tag
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^UX-28 ' test/wave2/ux-outline.test.ts
      - name: UX-29 progress line on the outline
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^UX-29 ' test/wave2/ux-outline.test.ts
      - name: UX-30 marking states and errors
        if: success() || failure()
