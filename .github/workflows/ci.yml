# Trusted test location: every push to main and every pull request is tested
# on a fresh GitHub runner from a clean checkout. The Builder cannot change
# the results here; the Verifier judges from these results alone.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      # Browser install reliability (one run timed out inside the Chromium
      # download before any test ran). Chromium is cached between runs in
      # Playwright's own folder, keyed on the exact Playwright version from the
      # lockfile: each Playwright release pins one Chromium build, so a new
      # version gets a new cache entry and an old one is never reused. The
      # cache holds only the downloaded browser; the install step below still
      # runs every time (system libraries first, then the browser, which is
      # only checked on a hit). Download attempts are bounded and retried.
      # The runner image (ImageOS, ImageVersion) is in the key too, so a new
      # runner image never reuses a browser cached on an older one.
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      # Each check below runs even if an earlier one failed, so every result
      # is visible. The job fails if any of them fails.
      - name: Rails
        if: success() || failure()
        run: node --test test/rails.test.js
      - name: Type check
        if: success() || failure()
        run: npm run typecheck
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      # One named step per acceptance test ("AT-1 ...", "AT-5 ...").
      - name: AT-1 owner shapes a space and appoints its admin
        if: success() || failure()
        run: npm run test:at1
      - name: AT-1 guard - every user-facing word comes through the label function
        if: success() || failure()
        run: npm run test:guard:labels
      - name: AT-1 guard - the test clock cannot be enabled in production
        if: success() || failure()
        run: npm run test:guard:clock
      - name: AT-1 guard - the AT-1 test passes when the run crosses midnight UTC
        if: success() || failure()
        run: npm run test:at1:midnight
      - name: AT-4 a learner sees exactly what was assigned
        if: success() || failure()
        run: npm run test:at4
      - name: AT-4 guard - a space never reads another space's rows
        if: success() || failure()
        run: npm run test:guard:spaces
      - name: AT-3 the publisher builds the subject
        if: success() || failure()
        run: npm run test:at3
      - name: AT-3 guard - every admin and publisher route is role-gated
        if: success() || failure()
        run: npm run test:guard:roles
      - name: AT-2 the admin staffs the space and assigns a subject
        if: success() || failure()
        run: npm run test:at2
      - name: AT-2 guard - reset links are single-use, bound to the username and expire
        if: success() || failure()
        run: npm run test:guard:reset
      - name: AT-2 guard - failed sign-ins are rate-limited and access starts on its start date
        if: success() || failure()
        run: npm run test:guard:doors
      - name: Upload evidence (screenshots, reports)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
