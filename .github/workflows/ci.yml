  # LMS wave 3a, task W3a-1 (product-contract v2 on PIL-216, rev 95302322):
  # "View as <learner>". One named step per labelled expectation (W3a AT-1.1 to
  # AT-5.4) and per UX floor item (UX-18 to UX-26), each selecting its part of
  # a shared test file by name. The statement spy needs the in-process product,
  # so this job runs the router in Node (LMS_TEST_RUNTIME=in-process); the
  # wave-1 job keeps running the learner pages on workerd. W3a AT-3.1 runs the
  # preview journey once and records it in evidence/wave3a/ for this run; the
  # later AT-3 steps judge that record. Screenshots go to evidence/ux/.
  wave-3a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: W3a AT-1.1 the admin's preview home lists exactly the space's published subjects, and every subject can be previewed
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-1\.1 ' test/wave3a/at1.test.ts
      - name: W3a AT-1.2 the publisher's preview home lists only her published subjects, and another publisher's subject is refused
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-1\.2 ' test/wave3a/at1.test.ts
      - name: W3a AT-1.3 the owner's preview is an empty learner home with the space's look, and reads nothing inside the space
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-1\.3 ' test/wave3a/at1.test.ts
      - name: W3a AT-1.4 learners and guardians are refused every preview address before any lookup, and see no preview link
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-1\.4 ' test/wave3a/at1.test.ts
      - name: W3a AT-1.5 the admin's preview of another space's subject or lesson is refused
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-1\.5 ' test/wave3a/at1.test.ts
      - name: W3a AT-2.0 the fixture still pins the comparisons
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-2\.0 ' test/wave3a/at2.test.ts
      - name: W3a AT-2.1 each normalised preview document equals the normalised learner document
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-2\.1 ' test/wave3a/at2.test.ts
      - name: W3a AT-2.2 every learner link leads to its preview address with the same from, and Next and Previous follow Salma's sequence
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^W3a AT-2\.2 ' test/wave3a/at2.test.ts
      - name: W3a AT-2.3 removed items never appear in a preview page, and their preview addresses answer 404 as Salma's do
