        run: npm run test:wave3b -- --test-name-pattern='^W8 AT-5\.2 (\(W8-1a|the page)' test/wave8/at5.test.ts
      - name: W8 AT-5.3 migration 0017 is additive, a41f7d8 runs on the migrated database, the down script restores its schema
