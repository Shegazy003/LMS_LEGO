      - name: UX-24 no sideways scroll in preview and entry pages
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^UX-24 ' test/wave3a/ux.test.ts
      - name: UX-25 sizes and contrast in preview and entry pages
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^UX-25 ' test/wave3a/ux.test.ts
      - name: UX-26 Arabic, mixed text and kit words in preview (three kits)
        if: success() || failure()
        run: npm run test:wave3a -- --test-name-pattern='^UX-26 ' test/wave3a/ux.test.ts
      # LMS wave 2, task W2-1a (product-contract v2 on PIL-225, rev be07da3d):
      # done marks, write path and data rules. These steps share this job (no
      # new job): they need the same in-process product for the statement spy,
      # and W2 AT-4.4 judges the record the W3a AT-3 steps above wrote in this
