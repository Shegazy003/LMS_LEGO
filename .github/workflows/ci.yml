      - name: Check out main a41f7d8 for the N1 comparison (code only, never run but by the comparison)
        if: success() || failure()
        uses: actions/checkout@v4
        with:
          ref: a41f7d85b02f5dae353c28d5d8c2943098baa44b
          path: .base-w8
          persist-credentials: false
      - name: W8 AT-5.1 every learner, guardian and preview response is identical (N1) to the stored a41f7d8 fixtures
        if: success() || failure()
