  # LMS redesign wave R1a (product-contract v2 and ux-plan on PIL-322): the
  # shared look and the learner home in the seeded world (test/redesign). Each
  # acceptance sub-test and each UX item is its own step; the screenshots under
  # evidence/ux/ (and the prototype reference under evidence/ux/ref/) are
  # evidence only, not the gate.
  redesign-r1a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: Build the static assets (fonts and licence)
        run: npm run build:assets
      - name: AT-R1a.1a UX-94 readable text on any school colour
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1a.1a ' test/redesign/look.test.ts
      - name: AT-R1a.1b UX-94 twelve subject colours
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1a.1b ' test/redesign/look.test.ts
      - name: AT-R1a.1c fnv1a32 vectors and automatic colours in any order
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1a.1c ' test/redesign/look.test.ts
      - name: AT-R1a.1d UX-94 measured contrast in the seeded world
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1a.1d ' test/redesign/ux.test.ts
      - name: AT-R1a.1e no hard-coded blue on learner and guardian pages
