# Trusted test location: every push to main and every pull request is tested
# on a fresh GitHub runner from a clean checkout. The Builder cannot change
# the results here; the Verifier judges from these results alone.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium
      # Each check below runs even if an earlier one failed, so every result
      # is visible. The job fails if any of them fails.
      - name: Rails
        if: success() || failure()
        run: node --test test/rails.test.js
      - name: Type check
        if: success() || failure()
        run: npm run typecheck
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      # One named step per acceptance test ("AT-1 ...", "AT-5 ...").
      - name: AT-1 owner shapes a space and appoints its admin
        if: success() || failure()
        run: npm run test:at1
      - name: AT-1 guard - every user-facing word comes through the label function
        if: success() || failure()
        run: npm run test:guard:labels
      - name: AT-1 guard - the test clock cannot be enabled in production
        if: success() || failure()
        run: npm run test:guard:clock
      - name: AT-4 a learner sees exactly what was assigned
        if: success() || failure()
        run: npm run test:at4
      - name: AT-4 guard - a space never reads another space's rows
        if: success() || failure()
        run: npm run test:guard:spaces
      - name: Upload evidence (screenshots, reports)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
