# Trusted test location: every push to main and every pull request is tested
# on a fresh GitHub runner from a clean checkout. The Builder cannot change
# the results here; the Verifier judges from these results alone.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      # Browser install reliability (one run timed out inside the Chromium
      # download before any test ran). Chromium is cached between runs in
      # Playwright's own folder, keyed on the exact Playwright version from the
      # lockfile: each Playwright release pins one Chromium build, so a new
      # version gets a new cache entry and an old one is never reused. The
      # cache holds only the downloaded browser; the install step below still
      # runs every time (system libraries first, then the browser, which is
      # only checked on a hit). Download attempts are bounded and retried.
      # The runner image (ImageOS, ImageVersion) is in the key too, so a new
      # runner image never reuses a browser cached on an older one.
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      # Each check below runs even if an earlier one failed, so every result
      # is visible. The job fails if any of them fails.
      - name: Rails
        if: success() || failure()
        run: node --test test/rails.test.js
      - name: Type check
        if: success() || failure()
        run: npm run typecheck
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      # Housekeeping Q1 (PIL-243): the test set-up's `wrangler d1 execute`
      # calls retry on SQLITE_BUSY / ECONNRESET only (test/support/busy.ts).
      - name: HQ-1 every wrangler d1 execute call in the test set-up goes through the shared retry helper
        if: success() || failure()
        run: npm run test:hq -- --test-name-pattern='^HQ-1 ' test/housekeeping/d1-retry.test.ts
      - name: HQ-4 a stubbed d1 execute command - a busy error then success passes, busy every time fails after 3 retries, any other error fails at once
        if: success() || failure()
        run: npm run test:hq -- --test-name-pattern='^HQ-4' test/housekeeping/d1-retry.test.ts
      # One named step per acceptance test ("AT-1 ...", "AT-5 ...").
      - name: AT-1 owner shapes a space and appoints its admin
        if: success() || failure()
        run: npm run test:at1
      - name: AT-1 guard - every user-facing word comes through the label function
        if: success() || failure()
        run: npm run test:guard:labels
      - name: AT-1 guard - the test clock cannot be enabled in production
        if: success() || failure()
        run: npm run test:guard:clock
      - name: AT-1 guard - the AT-1 test passes when the run crosses midnight UTC
        if: success() || failure()
        run: npm run test:at1:midnight
      - name: AT-4 a learner sees exactly what was assigned
        if: success() || failure()
        run: npm run test:at4
      - name: AT-4 guard - a space never reads another space's rows
        if: success() || failure()
        run: npm run test:guard:spaces
      - name: AT-3 the publisher builds the subject
        if: success() || failure()
        run: npm run test:at3
      - name: AT-3 guard - every admin and publisher route is role-gated
        if: success() || failure()
        run: npm run test:guard:roles
      - name: AT-2 the admin staffs the space and assigns a subject
        if: success() || failure()
        run: npm run test:at2
      - name: AT-2 guard - reset links are single-use, bound to the username and expire
        if: success() || failure()
        run: npm run test:guard:reset
      - name: AT-2 guard - failed sign-ins are rate-limited and access starts on its start date
        if: success() || failure()
        run: npm run test:guard:doors
      - name: AT-5 the kit changes every word, and no code changes
        if: success() || failure()
        run: npm run test:at5
      - name: AT-5 guard - every form refuses a cross-origin post
        if: success() || failure()
        run: npm run test:guard:cross-origin
      - name: AT-5 guard - usernames, display names and kit labels are bounded
        if: success() || failure()
        run: npm run test:guard:bounds
      # Release 1.1 (contract 0.2): one named step per acceptance test.
      - name: AT-6 the admin corrects a person
        if: success() || failure()
        run: npm run test:at6
      - name: AT-6 guard - ending access is immediate and stops sessions and reset links
        if: success() || failure()
        run: npm run test:guard:end-access
      - name: AT-6 follow-ups - ended people and the refresh race
        if: success() || failure()
        run: npm run test:guard:end-access-followups
      - name: AT-7 the admin tidies groups and subjects
        if: success() || failure()
        run: npm run test:at7
      - name: AT-7 guard - unassigning takes effect on every direct link
        if: success() || failure()
        run: npm run test:guard:unassign
      - name: AT-8 the publisher corrects content safely
        if: success() || failure()
        run: npm run test:at8
      - name: AT-8 guard - removed content never reaches a learner
        if: success() || failure()
        run: npm run test:guard:removed
      # The deploy rails (build task 6), proven with no Cloudflare account:
      # the production bundle builds without the test hooks; deploy.yml starts
      # only by hand from main, with a read-only token, and never prints its
      # secrets; the migrations apply to a fresh local database and a second
      # apply changes nothing; the smoke check passes only on a production
      # build. Then the owner's last-resort reset, against the local database.
      - name: Deploy rails - the production bundle builds and the deploy workflow is safe
        if: success() || failure()
        run: npm run test:deploy-rails
      - name: Deploy rails - the owner's last-resort reset works on the local database
        if: success() || failure()
        run: npm run test:last-resort
      # Build task 7: the password strength is a deploy-time setting
      # (PASSWORD_ITERATIONS), stored with each password and re-written at the
      # configured strength on the next sign-in. Production runs at the decided
      # 10,000 (owner decision B, 1 November 2026; asserted by the production
      # guard in this step); the code's default stays 100,000.
      - name: Password strength - stored per password, upgraded at sign-in, production at the decided value
        if: success() || failure()
        run: npm run test:password-strength
      # Hardening task H-1 (contract section 4): Workers Logs on with request
      # logs off and the sampling stated against the free plan; no product log
      # line holds a secret; a password change always beats the sign-in
      # re-hash. All three run the product in this process or read the
      # configuration: no Cloudflare account.
      - name: H1-1 H1-2 Workers Logs on, request logs off, sampling within the free plan
        if: success() || failure()
        run: npm run test:h1:logs
      - name: H1-3 guard - no product log line holds a password, a token, a full mobile number or a session id
        if: success() || failure()
        run: npm run test:guard:no-secrets
      - name: H1-4 the sign-in re-hash never beats a concurrent password change
        if: success() || failure()
        run: npm run test:guard:rehash-race
      - name: Upload evidence (screenshots, reports)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
  # Release 2 (contract product-contract-r2 on PIL-120), task R2-a: guardians.
  # One named step per acceptance sub-check (AT-9a to AT-9h, AT-13a to AT-13d,
  # AT-14b). A job of its own, beside "test", so the run takes no longer.
  release-2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-9a the admin appoints a guardian, and an end date past the admin's own is refused
        if: success() || failure()
        run: npm run test:at9a
      - name: AT-9b the admin links G1 to A and B and G2 to A, and only a learner of the space can be linked
        if: success() || failure()
        run: npm run test:at9b
      - name: AT-9c the admin sends a guardian a first-password reset link by WhatsApp or Copy
        if: success() || failure()
        run: npm run test:at9c
      - name: AT-9d a guardian sees only linked learners with their subjects and publishers, other addresses refused identically
        if: success() || failure()
        run: npm run test:at9d
      - name: AT-9e removing a link after a step naming both hides the learner at once, and Restore brings it back
        if: success() || failure()
        run: npm run test:at9e
      - name: AT-9f an ended guardian sees the access-ended message everywhere, and an ended learner is hidden until restored
        if: success() || failure()
        run: npm run test:at9f
      - name: AT-9g a guardian cannot appoint, edit or open a lesson or material, refused identically
        if: success() || failure()
        run: npm run test:at9g
      - name: AT-9h a person with two roles sees each view under its own role, and nobody is their own guardian
        if: success() || failure()
        run: npm run test:at9h
      - name: AT-13a no lesson-activity phrase, date, count or time on guardian pages outside the lesson-activity page, and the only lesson open stored is AT-15's
        if: success() || failure()
        run: npm run test:at13a
      - name: AT-13b the forbidden-string scan finds nothing a guardian or learner can reach, results and lesson-activity pages included, in Arabic and English
        if: success() || failure()
        run: npm run test:at13b
      - name: AT-13c the H-1 no-secrets guard passes with the guardian, marks and lesson-activity pages and logs, and numbers stay masked
        if: success() || failure()
        run: npm run test:at13c
      - name: AT-13d new labels in Arabic and English through the dictionary, and no-store on every guardian, results, marks and lesson-activity page
        if: success() || failure()
        run: npm run test:at13d
      - name: AT-14b the README states what stays on a rollback
        if: success() || failure()
        run: npm run test:at14b
      - name: Upload evidence (release 2 screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-2
          path: evidence/
  # Release 2, task R2-b: exams, publishing, My results, and the reset-form
  # retry. One named step per acceptance sub-check (AT-10a to AT-10g, AT-11a
  # to AT-11c; the results pages of AT-13 are in "release-2", the 0008
  # migration of AT-14a in "rollback"). A job of its own, beside the others.
  release-2-results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-10a the publisher creates an exam in their subject; another publisher, an admin and a learner cannot create, save or publish
        if: success() || failure()
        run: npm run test:at10a
      - name: AT-10b the marks page lists every learner of the subject by name then username, each told apart, 40 rows at phone width
        if: success() || failure()
        run: npm run test:at10b
      - name: AT-10c accepted mark forms are stored as one number; refused forms are named beside the row and nothing is published
        if: success() || failure()
        run: npm run test:at10c
      - name: AT-10d a draft comes back in the same order, and a draft row answers a learner or guardian exactly as a missing row
        if: success() || failure()
        run: npm run test:at10d
      - name: AT-10e Publish lists every row first, Cancel changes nothing, and a changed list is named and must be completed
        if: success() || failure()
        run: npm run test:at10e
      - name: AT-10f Publish is atomic with a history row per result; a link never publishes; a second tab changes nothing; a late joiner alone
        if: success() || failure()
        run: npm run test:at10f
      - name: AT-10g the retry of a cut-off reset form says the password is already changed, in Arabic and English, not link gone
        if: success() || failure()
        run: npm run test:at10g
      - name: AT-11a each learner sees exactly their own published results, with no average, rank, grade, other person or draft
        if: success() || failure()
        run: npm run test:at11a
      - name: AT-11b another learner's list or result is refused identically, existing or not
        if: success() || failure()
        run: npm run test:at11b
      - name: AT-11c a learner who leaves keeps their published results and gets no row for later exams
        if: success() || failure()
        run: npm run test:at11c
      - name: Upload evidence (release 2 results screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-2-results
          path: evidence/
  # Release 2, task R2-c: results views (guardian, admin, publisher) and
  # reasoned corrections with their history and the exam locks. One named step
  # per acceptance sub-check (AT-11d to AT-11f, AT-12a to AT-12e; AT-13 on the
  # new views is in "release-2"). No migration: "rollback" is unchanged.
  release-2-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-11d a guardian sees the results of exactly their linked learners, labelled with the name; a removed link or ended access hides at once
        if: success() || failure()
        run: npm run test:at11d
      - name: AT-11e the admin sees all results of the space, a publisher only their own subjects, another space nothing
        if: success() || failure()
        run: npm run test:at11e
      - name: AT-11f an ended learner, guardian or publisher sees access ended instead of results; an ended publisher cannot correct until restored
        if: success() || failure()
        run: npm run test:at11f
      - name: AT-12a a published mark is corrected with a reason; learner and guardian see the new value with Corrected on date, never the old one
        if: success() || failure()
        run: npm run test:at12a
      - name: AT-12b publisher and admin see each row's history, first publish then every correction, also for a late joiner
        if: success() || failure()
        run: npm run test:at12b
      - name: AT-12c an empty reason, a mark outside 0 to maximum and anyone but the current publisher are refused, changing nothing
        if: success() || failure()
        run: npm run test:at12c
      - name: AT-12d exam title, date and maximum are editable before publishing and locked once a mark is published
        if: success() || failure()
        run: npm run test:at12d
      - name: AT-12e the history rejects UPDATE and DELETE at the database, and a correction whose history fails changes nothing
        if: success() || failure()
        run: npm run test:at12e
      - name: Upload evidence (release 2 corrections screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-2-corrections
          path: evidence/
  # Release 2, task R2-d: lesson activity (the admin's switch with its tick,
  # the learner's last-opened date per lesson, the guardian's lesson-activity
  # page, the learner's notice). One named step per acceptance sub-check
  # (AT-15a to AT-15j with 15c-2; AT-13 on the new pages is in "release-2",
  # the 0010 migration of AT-14a in "rollback").
  release-2-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-15a off by default, a learner's opens write no row, and the guardian's learner page says it is not switched on
        if: success() || failure()
        run: npm run test:at15a
      - name: AT-15b the admin switches it on from one page with the required tick, only the admin, and switching off deletes the rows
        if: success() || failure()
        run: npm run test:at15b
      - name: AT-15c the guardian's page shows each lesson with its last-opened date or No open recorded, titles and dates only, 40 lessons at phone width
        if: success() || failure()
        run: npm run test:at15c
      - name: AT-15c-2 Recording since is the later of the switch-on day and the link day, and nothing earlier is shown
        if: success() || failure()
        run: npm run test:at15c2
      - name: AT-15d only the learner's own successful open of an assigned lesson writes, and no endpoint writes a view
        if: success() || failure()
        run: npm run test:at15d
      - name: AT-15e the lesson_view table holds a space, a lesson, a learner and a calendar day, nothing else
        if: success() || failure()
        run: npm run test:at15e
      - name: AT-15f every learner sees the notice on the home page and on each lesson page while it is on, built from the kit
        if: success() || failure()
        run: npm run test:at15f
      - name: AT-15g no automatic disposal - a 400-day-old open is still stored and shown, and only the switch-off deletes
        if: success() || failure()
        run: npm run test:at15g
      - name: AT-15h a removed link, ended access and leaving the subject hide the activity at once, and restore brings it back
        if: success() || failure()
        run: npm run test:at15h
      - name: AT-15i a failed view-row write still opens the lesson, and its log line names nobody and nothing
        if: success() || failure()
        run: npm run test:at15i
      - name: AT-15j the phrase scan finds nothing outside the exempt pages or in logs, and nothing is ever sent about an open
        if: success() || failure()
        run: npm run test:at15j
      - name: Upload evidence (release 2 lesson activity screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-2-activity
          path: evidence/
  # LMS wave 1, task L1 (product-contract v2 on PIL-210): the learner journey.
  # One named step per labelled expectation (AT-1.1 to AT-3.5) and per UX floor
  # item of the ux-plan (UX-1 to UX-8, UX-14a to UX-17a); each step starts the
  # product with the made-up world of test/wave1/world.ts. Screenshots go to
  # evidence/ux/ as the ux-plan names them. A job of its own, beside the others.
  wave-1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-1.1 the home lists exactly the learner's published, assigned subjects, by title, in a fixed number of reads
        if: success() || failure()
        run: npm run test:wave1 -- test/wave1/at1-1.test.ts
      - name: AT-1.2 each card shows the title link, the teacher line, the lesson count and Start to the first lesson only
        if: success() || failure()
        run: npm run test:wave1 -- test/wave1/at1-2.test.ts
      - name: AT-1.3 the empty subject card says No lessons here yet with no Start, and a home with nothing assigned holds only today's sentence
        if: success() || failure()
        run: npm run test:wave1 -- test/wave1/at1-3.test.ts
      - name: AT-1.4 My results is in the top navigation of every learner page, marked current on My results, and the bottom link is gone
        if: success() || failure()
        run: npm run test:wave1 -- test/wave1/at1-4.test.ts
      - name: AT-1.5 Company and University cards say Trainer, Session, Lecturer, Lecture and no School word, and the label guard passes
        if: success() || failure()
        run: npm run test:wave1 -- test/wave1/at1-5.test.ts
      - name: AT-1.6 the home shows no other learner's name, username or result
        if: success() || failure()
        run: npm run test:wave1 -- test/wave1/at1-6.test.ts
      - name: AT-2.1 Next and Previous follow chapter order then lesson order, skipping empty and removed items
        if: success() || failure()
        run: npm run test:wave1 -- test/wave1/at2-1.test.ts
      - name: AT-2.2 each lesson shows its place N / M, and Next and Previous with their titles and the chapter line when crossing
