      - name: W8 AT-3.8 wave 4's own tests pass untouched (its base comparison runs in job wave-4)
        if: success() || failure()
        run: npm run test:wave3b -- test/wave4/at1.test.ts test/wave4/at2.test.ts test/wave4/at3.test.ts test/wave4/at4.test.ts test/wave4/at5.test.ts test/wave4/ux.test.ts
