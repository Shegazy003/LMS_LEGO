  # LMS redesign wave R1b (product-contract v2 on PIL-322, S7; ux-plan UX-101):
  # the teacher's choice of a subject's colour and icon (migration 0018), in the
  # seeded world (test/redesign/r1b.test.ts, r1b-ux.test.ts). Each acceptance
  # test, its sub-tests and the UX item are their own steps; the screenshots
  # under evidence/ux/ are evidence only, not the gate.
  redesign-r1b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: Build the static assets (fonts and licence)
        run: npm run build:assets
      - name: AT-R1b.0 the colour and icon sets, automatic for NULL and unknown keys
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1b.0 ' test/redesign/r1b.test.ts
      - name: AT-R1b.1 choose and see
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1b.1 ' test/redesign/r1b.test.ts
      - name: AT-R1b.2 refusals store nothing
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1b.2 ' test/redesign/r1b.test.ts
      - name: AT-R1b.3a an unknown stored key renders automatic with status 200
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1b.3a ' test/redesign/r1b.test.ts
      - name: AT-R1b.3b two saves end with one whole look
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1b.3b ' test/redesign/r1b.test.ts
      - name: AT-R1b.3c copy and export paths of subject rows
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1b.3c ' test/redesign/r1b.test.ts
      - name: AT-R1b.4 migration 0018, down script and deploy note
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^AT-R1b.4 ' test/redesign/r1b.test.ts
      - name: AT-R1b.4 migration hashes and schema checks stay green
        if: success() || failure()
        run: npm run test:redesign -- test/deploy/migrations.test.ts
      - name: UX-101 look card radios names and refusals
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^UX-101 look card ' test/redesign/r1b-ux.test.ts
      - name: UX-101 live sample
        if: success() || failure()
        run: npm run test:redesign -- --test-name-pattern='^UX-101 live sample' test/redesign/r1b-ux.test.ts
      - name: Upload evidence (redesign R1b screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-redesign-r1b
          path: evidence/
  # AT-14a: rollback holds. The code live before release 2 (main at f3b1fa7,
  # the H-1 version 528786a4, the rollback target) is checked out beside this
  # commit and given this commit's migrations, so the old code runs on a
  # release 2 database. Then the rollback probe (test/rollback) and the release
  # 1.1 suite run inside that checkout, with its own code and helpers. Each
  # release 2 task adds its migration here simply by adding the file.
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check out the release 1.1 code (the rollback target)
        uses: actions/checkout@v4
        with:
          ref: f3b1fa7677b7ea534bdabc2129084603e9a54806
          path: release-1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the release 1.1 code (its own lockfile)
        working-directory: release-1.1
        run: npm ci
      - name: Read the Playwright version
        id: playwright
        working-directory: release-1.1
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        working-directory: release-1.1
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-14a give the release 1.1 code the release 2 migrations and the rollback probe
        run: |
          for f in migrations/*.sql; do
            if [ ! -e "release-1.1/$f" ]; then cp "$f" "release-1.1/$f"; echo "added $f"; fi
          done
          mkdir -p release-1.1/test/rollback
          cp test/rollback/*.test.ts release-1.1/test/rollback/
          # Housekeeping Q1 (PIL-243): the set-up's `wrangler d1 execute` calls
          # retry on SQLITE_BUSY / ECONNRESET only. Release 1.1's worker.ts is
          # this one without the retry; its product code is untouched.
          cp test/support/busy.ts test/support/worker.ts release-1.1/test/support/
          ls release-1.1/migrations
      - name: AT-14a release 1.1 code on the release 2 database shows a guardian nothing, shows nobody a mark, exposes nothing, writes and deletes nothing
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout test/rollback/old-code.test.ts
      - name: W2 AT-3.3 release 1.1 code on the database with a done mark shows nobody anything of it, writes none and deletes none
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W2 AT-3\.3 ' test/rollback/old-code.test.ts
      - name: W3b AT-5.5 release 1.1 code on the database with an upload row and a no-password person shows nothing of an upload, refuses that sign-in as a wrong password, and its reset link sets the password
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W3b AT-5\.5 ' test/rollback/old-code.test.ts
      - name: W4 AT-5.3 release 1.1 code on the database with a subject set in order opens every lesson (no lock) and writes nothing to the setting
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W4 AT-5\.3 ' test/rollback/old-code.test.ts
      - name: W5 AT-5.3 release 1.1 code on the database with announcements shows none, has no announcement address and writes nothing to the table
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W5 AT-5\.3 ' test/rollback/old-code.test.ts
      - name: W6 AT-5.3 release 1.1 code on the database with due dates shows none, has no due-dates address and writes no due date
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W6 AT-5\.3 ' test/rollback/old-code.test.ts
      - name: W7 AT-6.3 release 1.1 code on the database with quizzes and attempts shows no quiz or score, has no quiz address and writes nothing to the quiz tables
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W7 AT-6\.3 ' test/rollback/old-code.test.ts
      - name: AT-14a release 1.1 suite on the release 2 database - AT-1
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at1
      - name: AT-14a release 1.1 suite on the release 2 database - AT-4
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at4
      - name: AT-14a release 1.1 suite on the release 2 database - AT-3
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at3
      - name: AT-14a release 1.1 suite on the release 2 database - AT-2
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at2
      - name: AT-14a release 1.1 suite on the release 2 database - AT-5
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at5
      - name: AT-14a release 1.1 suite on the release 2 database - AT-6 and its guards
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at6 && npm run test:guard:end-access && npm run test:guard:end-access-followups
      - name: AT-14a release 1.1 suite on the release 2 database - AT-7 and its guard
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at7 && npm run test:guard:unassign
      - name: AT-14a release 1.1 suite on the release 2 database - AT-8 and its guard
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at8 && npm run test:guard:removed
      - name: AT-14a release 1.1 suite on the release 2 database - release 1 guards
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:guard:roles && npm run test:guard:reset && npm run test:guard:doors && npm run test:guard:cross-origin && npm run test:guard:bounds
      - name: Upload evidence (release 1.1 suite on the release 2 database)
        if: always() && hashFiles('release-1.1/evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-rollback
          path: release-1.1/evidence/
