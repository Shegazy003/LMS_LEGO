        with:
          name: evidence-wave-3a
          path: evidence/
  # LMS wave 3b, task W3b-1a (product-contract v2 on PIL-232, rev 66f02794;
  # ux-plan rev 37143f21): add a class from a spreadsheet. One named step per
  # labelled expectation and UX item, in the in-process product (statement
  # spy, forced faults). W3b AT-5.5 is a step of the rollback job.
  wave-3b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: W3b AT-1.1 the check page counts and lists every row, the refused first with all their reasons, then the rows to add
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-1\.1 ' test/wave3b/at1.test.ts
      - name: W3b AT-1.2 every check saves nothing but the usage_day counter (the gate's only write), runs only reads, logs nothing and makes no reset link
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-1\.2 ' test/wave3b/at1.test.ts
      - name: W3b AT-1.3 each whole-file refusal is the upload page with one message, nothing listed, nothing saved
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-1\.3 ' test/wave3b/at1.test.ts
      - name: W3b AT-1.4 each row rule refuses that row only, with its reason
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-1\.4 ' test/wave3b/at1.test.ts
      - name: W3b AT-1.5 the accepted forms pass, dates show the month as a word, rows are numbered as the spreadsheet does
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-1\.5 ' test/wave3b/at1.test.ts
      - name: W3b AT-1.6 with script off the check works the same
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-1\.6 ' test/wave3b/at1.test.ts
      - name: W3b AT-1.7 names from the file are shown as text, each in its own bdi, and carried byte for byte
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-1\.7 ' test/wave3b/at1.test.ts
      - name: W3b AT-2.1 one add makes exactly the 8 accounts and memberships and answers 303 to the done page
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-2\.1 ' test/wave3b/at2.test.ts
      - name: W3b AT-2.2 changed since the check, nothing saved, 409 with a fresh check
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-2\.2 ' test/wave3b/at2.test.ts
      - name: W3b AT-2.3 a failed write saves nothing and logs only the fixed event
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-2\.3 ' test/wave3b/at2.test.ts
      - name: W3b AT-2.4 a second press is not a second add; another admin gets the changed answer; a second check offers no add
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-2\.4 ' test/wave3b/at2.test.ts
      - name: W3b AT-2.5 the people list shows No password yet; everyone else is unchanged; script off works the same
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-2\.5 ' test/wave3b/at2.test.ts
      - name: W3b AT-3.1 a new person has the no-password value; every sign-in attempt is refused as a wrong password and counts
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-3\.1 ' test/wave3b/at3.test.ts
      - name: W3b AT-3.2 the person page says No password yet; today's reset link flow is unchanged and sets it; the tag and the line then go; Set a new password does the same
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-3\.2 ' test/wave3b/at3.test.ts
      - name: W3b AT-3.3 the upload makes no reset link and no password; the upload code hashes nothing
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-3\.3 ' test/wave3b/at3.test.ts
      - name: W3b AT-3.4 old reset rules still hold for new people
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-3\.4 ' test/wave3b/at3.test.ts
      - name: W3b AT-3.5 every reader of password_hash is listed and refuses the no-password value
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-3\.5 ' test/wave3b/at3.test.ts
      - name: W3b AT-3.6 the follow-up for a whole class, three people in turn from the done page, one tap, the link once, Back to the upload at their row, Password set after one sets it
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-3\.6 ' test/wave3b/at3.test.ts
      - name: W3b AT-4.1 every other person is refused with today's answer before any upload work (owner, publisher, learner, guardian, other space admin, ended admin, cross-site, other space upload id, unknown upload id)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-4\.1 ' test/wave3b/at4.test.ts
      - name: W3b AT-4.2 rows go only into the space in the address
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-4\.2 ' test/wave3b/at4.test.ts
      - name: W3b AT-4.3 mobile numbers stay hidden
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-4\.3 ' test/wave3b/at4.test.ts
      - name: W3b AT-4.4 no-store, no-referrer, autocomplete off, the empty sheet an attachment with the header only
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-4\.4 ' test/wave3b/at4.test.ts
      - name: W3b AT-4.5 the server holds the limits and makes at most 2 round trips besides the gate's (prints the counts)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-4\.5 ' test/wave3b/at4.test.ts
      - name: W3b AT-4.6 CPU gate, median CPU of the check and of the add of a worst-case file at most 5 ms each (prints both medians)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-4\.6 ' test/wave3b/at4.test.ts
      - name: W3b AT-5.1 each add makes exactly one class_upload row of six fields; a check makes none
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-5\.1 ' test/wave3b/at5.test.ts
      - name: W3b AT-5.2 the upload page lists Earlier uploads, newest first, at most 10, each linking to its done page; each admin sees only their space's; no owner page shows an upload
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-5\.2 ' test/wave3b/at5.test.ts
      - name: W3b AT-5.3 the forward migration adds exactly class_upload and membership.class_upload_id; a second apply is a no-op
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-5\.3 ' test/wave3b/at5.test.ts
      - name: W3b AT-5.4 the down script brings the schema and the applied-migrations record back to main's
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-5\.4 ' test/wave3b/at5.test.ts
      - name: W3b AT-5.6 class_upload is a space table; deleting space W3b-a child-first removes only its upload rows
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W3b AT-5\.6 ' test/wave3b/at5.test.ts
      - name: UX-36 upload entry and page order
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-36 ' test/wave3b/ux.test.ts
      - name: UX-37 check page order and states
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-37 ' test/wave3b/ux.test.ts
      - name: UX-38 refusal, changed, failed and second-press states
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-38 ' test/wave3b/ux.test.ts
      - name: UX-39 done page and no-password tag
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-39 ' test/wave3b/ux.test.ts
      - name: UX-40 earlier uploads list
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-40 ' test/wave3b/ux.test.ts
      - name: UX-43 reset link round trip from the done page
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-43 ' test/wave3b/ux.test.ts
      - name: UX-41 Arabic, mixed text and kit words for the upload (three kits)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-41 ' test/wave3b/ux.test.ts
      - name: UX-42 keyboard, widths, sizes and contrast for the upload
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-42 ' test/wave3b/ux.test.ts
      - name: Upload evidence (wave 3b screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-wave-3b
          path: evidence/
  # LMS wave 4, task W4-1a (product-contract v2 on PIL-238, sections 3 and
  # 12): chapters in order. One job of its own, one step per labelled
  # expectation (`W4 AT-...`) and per UX item (`UX-44` to `UX-50`), each run
  # even after an earlier failure. The product runs in this process
  # (LMS_TEST_RUNTIME=in-process, as wave-3a and wave-3b), so the statement spy
  # counts the reads; AT-5.1 and AT-5.2 apply the migrations with Wrangler on a
  # fresh local D1. The generic runner script `test:wave3b` (node --test, one
  # file at a time) runs every file. AT-5.3's old-code case is in the rollback job.
  wave-4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: W4 AT-1.1 every subject starts off, also one created later; the editor and the subject admin page show the setting card
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-1\.1 ' test/wave4/at1.test.ts
      - name: W4 AT-1.2 Switch on and Switch off from the editor and the subject admin page, a set, 303 to #order-state, script on and off
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-1\.2 ' test/wave4/at1.test.ts
      - name: W4 AT-1.3 every refused case stores nothing (other publisher, learner, guardian, owner, ended access, cross-site, other space, made-up id, bad state, GET and HEAD)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-1\.3 ' test/wave4/at1.test.ts
      - name: W4 AT-1.4 with the setting off no page makes more reads than main's (d); every existing step passes (a, the rest of this run)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-1\.4 ' test/wave4/at1.test.ts
      # AT-1.4(b) and (c), the base comparison: main b4ad669 (pinned) runs beside this commit, in the same process,
      # on a copy of the same database (test/wave4/base.test.ts reads it from LMS_BASE_ROOT).
      - name: Check out main b4ad669 for the base comparison (code only, never run but by the comparison)
        if: success() || failure()
        uses: actions/checkout@v4
        with:
          ref: b4ad669c848a0454f700ab7e68bc24d0f5571095
          path: .base-main
          persist-credentials: false
      - name: W4 AT-1.4(b) base comparison, every page and mark POST with every setting off answers as main b4ad669 does (but the setting card)
        if: success() || failure()
        env:
          LMS_BASE_ROOT: ${{ github.workspace }}/.base-main
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-1\.4\(b\) ' test/wave4/base.test.ts
      - name: W4 AT-1.4(c) after switching on and off again from both pages, the base comparison passes again
        if: success() || failure()
        env:
          LMS_BASE_ROOT: ${{ github.workspace }}/.base-main
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-1\.4\(c\) ' test/wave4/base.test.ts
      - name: W4 AT-2.1 first look, the order box, Go to, the locked chapters with their reasons
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-2\.1 ' test/wave4/at2.test.ts
      - name: W4 AT-2.2 what done means, every shown lesson of every earlier chapter, the learner's own marks
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-2\.2 ' test/wave4/at2.test.ts
      - name: W4 AT-2.3 a locked lesson by its address, the locked page, HEAD, its file and its mark POST refused
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-2\.3 ' test/wave4/at2.test.ts
      - name: W4 AT-2.4 the lesson end around a lock, and after Mark as done the status sentence that Decimals is open now
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-2\.4 ' test/wave4/at2.test.ts
      - name: W4 AT-2.5 home never leads into a lock
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-2\.5 ' test/wave4/at2.test.ts
      - name: W4 AT-2.6 kits and languages for the order line, the reasons and the counts
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-2\.6 ' test/wave4/at2.test.ts
      - name: W4 AT-2.7 every lesson-keyed learner route is gated (the route table)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-2\.7 ' test/wave4/at2.test.ts
      - name: W4 AT-3.1 undo locks what follows again (marks kept), marking again opens it; status lines only when the press changed what is open
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-3\.1 ' test/wave4/at3.test.ts
      - name: W4 AT-3.2 a lesson added to a finished chapter locks what follows; done, removed or restored, the lock follows; the change note
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-3\.2 ' test/wave4/at3.test.ts
      - name: W4 AT-3.3 order changes, a chapter moved, lessons moved inside a chapter, the blocking chapter removed and restored
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-3\.3 ' test/wave4/at3.test.ts
      - name: W4 AT-3.4 a lesson moved to another chapter (database update), its mark follows it
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-3\.4 ' test/wave4/at3.test.ts
      - name: W4 AT-3.5 switching while learners are part-way; done marks identical before and after every switch and publisher change
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-3\.5 ' test/wave4/at3.test.ts
      - name: W4 AT-4.1 no page of Amal, Hadeer, Mona or the owner shows a lock; only the setting card and the change note are new
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-4\.1 ' test/wave4/at4.test.ts
      - name: W4 AT-4.2 each learner's locks come from their own marks only
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-4\.2 ' test/wave4/at4.test.ts
      - name: W4 AT-4.3 two roles, locks only where the person reads as a learner
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-4\.3 ' test/wave4/at4.test.ts
      - name: W4 AT-4.4 the preview shows a new learner's locks, reads no done mark and writes nothing
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-4\.4 ' test/wave4/at4.test.ts
      - name: W4 AT-4.5 the privacy scans AT-13a and AT-13b with the wave 4 words and Salma's locks present; no new cookie; no-store
        if: success() || failure()
        run: |
          npm run test:wave3b -- --test-name-pattern='^W4 AT-4\.5 ' test/wave4/at4.test.ts
          npm run test:wave3b -- test/at13/at13a.test.ts test/at13/at13b.test.ts
      - name: W4 AT-4.6 reads, off exactly main's, on at most one or two more (prints the counts)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-4\.6 ' test/wave4/at4.test.ts
      - name: W4 AT-5.1 the forward migration adds exactly subject.chapters_in_order; a second apply is a no-op
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-5\.1 ' test/wave4/at5.test.ts
      - name: W4 AT-5.2 the down script brings the schema and the applied-migrations record back to main's
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-5\.2 ' test/wave4/at5.test.ts
      - name: W4 AT-5.3 the README's rollback text (the old-code case is in the rollback job)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-5\.3 ' test/wave4/at5.test.ts
      - name: W4 AT-5.4 the setting is deleted with its subject and its space; no lock state is stored
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-5\.4 ' test/wave4/at5.test.ts
      - name: W4 AT-5.5 no route returns the setting but where allowed; the README and Later on export and backup
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W4 AT-5\.5 ' test/wave4/at5.test.ts
      - name: UX-44 setting card and change note
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-44 ' test/wave4/ux.test.ts
      - name: UX-45 locked chapters on the outline
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-45 ' test/wave4/ux.test.ts
      - name: UX-46 locked lesson page
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-46 ' test/wave4/ux.test.ts
      - name: UX-47 lesson end and status lines around a lock
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-47 ' test/wave4/ux.test.ts
      - name: UX-48 home actions lead to open lessons
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-48 ' test/wave4/ux.test.ts
      - name: UX-49 Arabic, mixed text and kit words for chapters in order (three kits)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-49 ' test/wave4/ux.test.ts
      - name: UX-50 widths, sizes, contrast and keyboard for chapters in order
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-50 ' test/wave4/ux.test.ts
      - name: Upload evidence (wave 4 screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-wave-4
          path: evidence/
  # LMS wave 5 (product-contract v2 on PIL-246): announcements to a subject.
  # One step per labelled expectation ("W5 AT-..." and "UX-5x ..."), the
  # product in this process (the statement spy), as wave-3a, wave-3b, wave-4.
  wave-5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: W5 AT-1.1 post from the editor and the subject admin page, 303 to the card, each page lists the other's, double tap stored once
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-1\.1 ' test/wave5/at1.test.ts
      - name: W5 AT-1.2 edit, own role only; the other role's edit form and save answer 403
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-1\.2 ' test/wave5/at1.test.ts
      - name: W5 AT-1.3 remove, the confirmation, the text erased, 404 after
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-1\.3 ' test/wave5/at1.test.ts
      - name: W5 AT-1.4 text rules, refused texts kept in the field, the live count matches the server
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-1\.4 ' test/wave5/at1.test.ts
      - name: W5 AT-1.5 every refused case stores nothing; one gate read, at most one more read, one write
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-1\.5 ' test/wave5/at1.test.ts
      - name: W5 AT-5.1 the forward migration creates exactly the table and the index; a second apply is a no-op
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-5\.1 ' test/wave5/at5.test.ts
      - name: W5 AT-5.2 the down script brings the schema and the applied-migrations record back to main's
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-5\.2 ' test/wave5/at5.test.ts
      - name: W5 AT-5.3 the README's rollback text (the old-code case is in the rollback job)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-5\.3 ' test/wave5/at5.test.ts
      - name: W5 AT-5.4 announcements go with their subject and their space; ending the writer's access changes none
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-5\.4 ' test/wave5/at5.test.ts
      - name: W5 AT-5.5 no route returns announcement text but the card's pages; README and Later on export, backup and erasure
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-5\.5 ' test/wave5/at5.test.ts
      - name: W5 deploy note
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^W5 deploy note' test/wave5/at5.test.ts
      - name: UX-51 teacher card order, labels and role controls
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-51 ' test/wave5/ux.test.ts
      - name: UX-52 status line, focus target and cancel links
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-52 ' test/wave5/ux.test.ts
      - name: UX-53 errors keep text, count matches server, button disabled
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-53 ' test/wave5/ux.test.ts
      - name: UX-56 language check by key (three kits)
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-56 language check by key' test/wave5/ux.test.ts
      - name: UX-56 deny list and placeholder neighbours
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-56 deny list' test/wave5/ux.test.ts
      - name: UX-56 no spaced slash in Arabic values
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-56 no spaced slash' test/wave5/ux.test.ts
      - name: UX-57 states table
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-57 ' test/wave5/ux.test.ts
      - name: UX-58 widths, targets, contrast and keyboard
        if: success() || failure()
        run: npm run test:wave3b -- --test-name-pattern='^UX-58 ' test/wave5/ux.test.ts
      # AT-4.1a and AT-4.1b, the base comparison: main b87bfc5 (pinned) runs beside this commit, in the same process,
      # on a copy of the same database (test/wave5/base.test.ts reads it from LMS_BASE_ROOT).
      - name: Check out main b87bfc5 for the base comparison (code only, never run but by the comparison)
        if: success() || failure()
        uses: actions/checkout@v4
        with:
          ref: b87bfc55f255a332f0593e45bf08c2fa5f96697d
          path: .base-main
          persist-credentials: false
      - name: W5 AT-4.1a (teacher pages) the editors and subject admin pages differ from main b87bfc5 only by the announcement card
        if: success() || failure()
        env:
          LMS_BASE_ROOT: ${{ github.workspace }}/.base-main
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-4\.1a ' test/wave5/base.test.ts
      - name: W5 AT-4.1b (every other page) same status and body as main b87bfc5; no learner page shows an announcement block
        if: success() || failure()
        env:
          LMS_BASE_ROOT: ${{ github.workspace }}/.base-main
        run: npm run test:wave3b -- --test-name-pattern='^W5 AT-4\.1b ' test/wave5/base.test.ts
      - name: Upload evidence (wave 5 screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-wave-5
          path: evidence/
  # AT-14a: rollback holds. The code live before release 2 (main at f3b1fa7,
  # the H-1 version 528786a4, the rollback target) is checked out beside this
  # commit and given this commit's migrations, so the old code runs on a
  # release 2 database. Then the rollback probe (test/rollback) and the release
  # 1.1 suite run inside that checkout, with its own code and helpers. Each
  # release 2 task adds its migration here simply by adding the file.
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check out the release 1.1 code (the rollback target)
        uses: actions/checkout@v4
        with:
          ref: f3b1fa7677b7ea534bdabc2129084603e9a54806
          path: release-1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the release 1.1 code (its own lockfile)
        working-directory: release-1.1
        run: npm ci
      - name: Read the Playwright version
        id: playwright
        working-directory: release-1.1
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        working-directory: release-1.1
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-14a give the release 1.1 code the release 2 migrations and the rollback probe
        run: |
          for f in migrations/*.sql; do
            if [ ! -e "release-1.1/$f" ]; then cp "$f" "release-1.1/$f"; echo "added $f"; fi
          done
          mkdir -p release-1.1/test/rollback
          cp test/rollback/*.test.ts release-1.1/test/rollback/
          # Housekeeping Q1 (PIL-243): the set-up's `wrangler d1 execute` calls
          # retry on SQLITE_BUSY / ECONNRESET only. Release 1.1's worker.ts is
          # this one without the retry; its product code is untouched.
          cp test/support/busy.ts test/support/worker.ts release-1.1/test/support/
          ls release-1.1/migrations
      - name: AT-14a release 1.1 code on the release 2 database shows a guardian nothing, shows nobody a mark, exposes nothing, writes and deletes nothing
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout test/rollback/old-code.test.ts
      - name: W2 AT-3.3 release 1.1 code on the database with a done mark shows nobody anything of it, writes none and deletes none
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W2 AT-3\.3 ' test/rollback/old-code.test.ts
      - name: W3b AT-5.5 release 1.1 code on the database with an upload row and a no-password person shows nothing of an upload, refuses that sign-in as a wrong password, and its reset link sets the password
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W3b AT-5\.5 ' test/rollback/old-code.test.ts
      - name: W4 AT-5.3 release 1.1 code on the database with a subject set in order opens every lesson (no lock) and writes nothing to the setting
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W4 AT-5\.3 ' test/rollback/old-code.test.ts
      - name: W5 AT-5.3 release 1.1 code on the database with announcements shows none, has no announcement address and writes nothing to the table
        if: success() || failure()
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout --test-name-pattern='^W5 AT-5\.3 ' test/rollback/old-code.test.ts
      - name: AT-14a release 1.1 suite on the release 2 database - AT-1
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at1
      - name: AT-14a release 1.1 suite on the release 2 database - AT-4
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at4
      - name: AT-14a release 1.1 suite on the release 2 database - AT-3
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at3
      - name: AT-14a release 1.1 suite on the release 2 database - AT-2
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at2
      - name: AT-14a release 1.1 suite on the release 2 database - AT-5
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at5
      - name: AT-14a release 1.1 suite on the release 2 database - AT-6 and its guards
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at6 && npm run test:guard:end-access && npm run test:guard:end-access-followups
      - name: AT-14a release 1.1 suite on the release 2 database - AT-7 and its guard
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at7 && npm run test:guard:unassign
      - name: AT-14a release 1.1 suite on the release 2 database - AT-8 and its guard
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at8 && npm run test:guard:removed
      - name: AT-14a release 1.1 suite on the release 2 database - release 1 guards
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:guard:roles && npm run test:guard:reset && npm run test:guard:doors && npm run test:guard:cross-origin && npm run test:guard:bounds
      - name: Upload evidence (release 1.1 suite on the release 2 database)
        if: always() && hashFiles('release-1.1/evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-rollback
          path: release-1.1/evidence/
