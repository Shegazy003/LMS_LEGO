  # LMS wave 7, W7-1 (product-contract v2 on PIL-261): the teacher builds, copies and sees quiz results. Each labelled
  # expectation is its own step; the product runs in this process so the statement spy is available.
  wave-7:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
