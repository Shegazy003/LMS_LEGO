# Trusted test location: every push to main and every pull request is tested
# on a fresh GitHub runner from a clean checkout. The Builder cannot change
# the results here; the Verifier judges from these results alone.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      # Browser install reliability (one run timed out inside the Chromium
      # download before any test ran). Chromium is cached between runs in
      # Playwright's own folder, keyed on the exact Playwright version from the
      # lockfile: each Playwright release pins one Chromium build, so a new
      # version gets a new cache entry and an old one is never reused. The
      # cache holds only the downloaded browser; the install step below still
      # runs every time (system libraries first, then the browser, which is
      # only checked on a hit). Download attempts are bounded and retried.
      # The runner image (ImageOS, ImageVersion) is in the key too, so a new
      # runner image never reuses a browser cached on an older one.
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      # Each check below runs even if an earlier one failed, so every result
      # is visible. The job fails if any of them fails.
      - name: Rails
        if: success() || failure()
        run: node --test test/rails.test.js
      - name: Type check
        if: success() || failure()
        run: npm run typecheck
      - name: Unit tests
        if: success() || failure()
        run: npm run test:unit
      # One named step per acceptance test ("AT-1 ...", "AT-5 ...").
      - name: AT-1 owner shapes a space and appoints its admin
        if: success() || failure()
        run: npm run test:at1
      - name: AT-1 guard - every user-facing word comes through the label function
        if: success() || failure()
        run: npm run test:guard:labels
      - name: AT-1 guard - the test clock cannot be enabled in production
        if: success() || failure()
        run: npm run test:guard:clock
      - name: AT-1 guard - the AT-1 test passes when the run crosses midnight UTC
        if: success() || failure()
        run: npm run test:at1:midnight
      - name: AT-4 a learner sees exactly what was assigned
        if: success() || failure()
        run: npm run test:at4
      - name: AT-4 guard - a space never reads another space's rows
        if: success() || failure()
        run: npm run test:guard:spaces
      - name: AT-3 the publisher builds the subject
        if: success() || failure()
        run: npm run test:at3
      - name: AT-3 guard - every admin and publisher route is role-gated
        if: success() || failure()
        run: npm run test:guard:roles
      - name: AT-2 the admin staffs the space and assigns a subject
        if: success() || failure()
        run: npm run test:at2
      - name: AT-2 guard - reset links are single-use, bound to the username and expire
        if: success() || failure()
        run: npm run test:guard:reset
      - name: AT-2 guard - failed sign-ins are rate-limited and access starts on its start date
        if: success() || failure()
        run: npm run test:guard:doors
      - name: AT-5 the kit changes every word, and no code changes
        if: success() || failure()
        run: npm run test:at5
      - name: AT-5 guard - every form refuses a cross-origin post
        if: success() || failure()
        run: npm run test:guard:cross-origin
      - name: AT-5 guard - usernames, display names and kit labels are bounded
        if: success() || failure()
        run: npm run test:guard:bounds
      # Release 1.1 (contract 0.2): one named step per acceptance test.
      - name: AT-6 the admin corrects a person
        if: success() || failure()
        run: npm run test:at6
      - name: AT-6 guard - ending access is immediate and stops sessions and reset links
        if: success() || failure()
        run: npm run test:guard:end-access
      - name: AT-6 follow-ups - ended people and the refresh race
        if: success() || failure()
        run: npm run test:guard:end-access-followups
      - name: AT-7 the admin tidies groups and subjects
        if: success() || failure()
        run: npm run test:at7
      - name: AT-7 guard - unassigning takes effect on every direct link
        if: success() || failure()
        run: npm run test:guard:unassign
      - name: AT-8 the publisher corrects content safely
        if: success() || failure()
        run: npm run test:at8
      - name: AT-8 guard - removed content never reaches a learner
        if: success() || failure()
        run: npm run test:guard:removed
      # The deploy rails (build task 6), proven with no Cloudflare account:
      # the production bundle builds without the test hooks; deploy.yml starts
      # only by hand from main, with a read-only token, and never prints its
      # secrets; the migrations apply to a fresh local database and a second
      # apply changes nothing; the smoke check passes only on a production
      # build. Then the owner's last-resort reset, against the local database.
      - name: Deploy rails - the production bundle builds and the deploy workflow is safe
        if: success() || failure()
        run: npm run test:deploy-rails
      - name: Deploy rails - the owner's last-resort reset works on the local database
        if: success() || failure()
        run: npm run test:last-resort
      # Build task 7: the password strength is a deploy-time setting
      # (PASSWORD_ITERATIONS), stored with each password and re-written at the
      # configured strength on the next sign-in. Production runs at the decided
      # 10,000 (owner decision B, 1 November 2026; asserted by the production
      # guard in this step); the code's default stays 100,000.
      - name: Password strength - stored per password, upgraded at sign-in, production at the decided value
        if: success() || failure()
        run: npm run test:password-strength
      # Hardening task H-1 (contract section 4): Workers Logs on with request
      # logs off and the sampling stated against the free plan; no product log
      # line holds a secret; a password change always beats the sign-in
      # re-hash. All three run the product in this process or read the
      # configuration: no Cloudflare account.
      - name: H1-1 H1-2 Workers Logs on, request logs off, sampling within the free plan
        if: success() || failure()
        run: npm run test:h1:logs
      - name: H1-3 guard - no product log line holds a password, a token, a full mobile number or a session id
        if: success() || failure()
        run: npm run test:guard:no-secrets
      - name: H1-4 the sign-in re-hash never beats a concurrent password change
        if: success() || failure()
        run: npm run test:guard:rehash-race
      - name: Upload evidence (screenshots, reports)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
  # Release 2 (contract product-contract-r2 on PIL-120), task R2-a: guardians.
  # One named step per acceptance sub-check (AT-9a to AT-9h, AT-13a to AT-13d,
  # AT-14b). A job of its own, beside "test", so the run takes no longer.
  release-2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-9a the admin appoints a guardian, and an end date past the admin's own is refused
        if: success() || failure()
        run: npm run test:at9a
      - name: AT-9b the admin links G1 to A and B and G2 to A, and only a learner of the space can be linked
        if: success() || failure()
        run: npm run test:at9b
      - name: AT-9c the admin sends a guardian a first-password reset link by WhatsApp or Copy
        if: success() || failure()
        run: npm run test:at9c
      - name: AT-9d a guardian sees only linked learners with their subjects and publishers, other addresses refused identically
        if: success() || failure()
        run: npm run test:at9d
      - name: AT-9e removing a link after a step naming both hides the learner at once, and Restore brings it back
        if: success() || failure()
        run: npm run test:at9e
      - name: AT-9f an ended guardian sees the access-ended message everywhere, and an ended learner is hidden until restored
        if: success() || failure()
        run: npm run test:at9f
      - name: AT-9g a guardian cannot appoint, edit or open a lesson or material, refused identically
        if: success() || failure()
        run: npm run test:at9g
      - name: AT-9h a person with two roles sees each view under its own role, and nobody is their own guardian
        if: success() || failure()
        run: npm run test:at9h
      - name: AT-13a no lesson-activity phrase, date, count or time on guardian pages, and no lesson open is stored
        if: success() || failure()
        run: npm run test:at13a
      - name: AT-13b the forbidden-string scan finds nothing a guardian or learner can reach, results pages included, in Arabic and English
        if: success() || failure()
        run: npm run test:at13b
      - name: AT-13c the H-1 no-secrets guard passes with the guardian and marks pages and logs, and numbers stay masked
        if: success() || failure()
        run: npm run test:at13c
      - name: AT-13d new labels in Arabic and English through the dictionary, and no-store on every guardian, results and marks page
        if: success() || failure()
        run: npm run test:at13d
      - name: AT-14b the README states what stays on a rollback
        if: success() || failure()
        run: npm run test:at14b
      - name: Upload evidence (release 2 screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-2
          path: evidence/
  # Release 2, task R2-b: exams, publishing, My results, and the reset-form
  # retry. One named step per acceptance sub-check (AT-10a to AT-10g, AT-11a
  # to AT-11c; the results pages of AT-13 are in "release-2", the 0008
  # migration of AT-14a in "rollback"). A job of its own, beside the others.
  release-2-results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-10a the publisher creates an exam in their subject; another publisher, an admin and a learner cannot create, save or publish
        if: success() || failure()
        run: npm run test:at10a
      - name: AT-10b the marks page lists every learner of the subject by name then username, each told apart, 40 rows at phone width
        if: success() || failure()
        run: npm run test:at10b
      - name: AT-10c accepted mark forms are stored as one number; refused forms are named beside the row and nothing is published
        if: success() || failure()
        run: npm run test:at10c
      - name: AT-10d a draft comes back in the same order, and a draft row answers a learner or guardian exactly as a missing row
        if: success() || failure()
        run: npm run test:at10d
      - name: AT-10e Publish lists every row first, Cancel changes nothing, and a changed list is named and must be completed
        if: success() || failure()
        run: npm run test:at10e
      - name: AT-10f Publish is atomic with a history row per result; a link never publishes; a second tab changes nothing; a late joiner alone
        if: success() || failure()
        run: npm run test:at10f
      - name: AT-10g the retry of a cut-off reset form says the password is already changed, in Arabic and English, not link gone
        if: success() || failure()
        run: npm run test:at10g
      - name: AT-11a each learner sees exactly their own published results, with no average, rank, grade, other person or draft
        if: success() || failure()
        run: npm run test:at11a
      - name: AT-11b another learner's list or result is refused identically, existing or not
        if: success() || failure()
        run: npm run test:at11b
      - name: AT-11c a learner who leaves keeps their published results and gets no row for later exams
        if: success() || failure()
        run: npm run test:at11c
      - name: Upload evidence (release 2 results screenshots)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-release-2-results
          path: evidence/
  # AT-14a: rollback holds. The code live before release 2 (main at f3b1fa7,
  # the H-1 version 528786a4, the rollback target) is checked out beside this
  # commit and given this commit's migrations, so the old code runs on a
  # release 2 database. Then the rollback probe (test/rollback) and the release
  # 1.1 suite run inside that checkout, with its own code and helpers. Each
  # release 2 task adds its migration here simply by adding the file.
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check out the release 1.1 code (the rollback target)
        uses: actions/checkout@v4
        with:
          ref: f3b1fa7677b7ea534bdabc2129084603e9a54806
          path: release-1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the release 1.1 code (its own lockfile)
        working-directory: release-1.1
        run: npm ci
      - name: Read the Playwright version
        id: playwright
        working-directory: release-1.1
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium for the browser test
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium for the browser test
        timeout-minutes: 10
        working-directory: release-1.1
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::Chromium install attempt $attempt did not finish; retrying"
            sleep 10
          done
          exit 1
      - name: AT-14a give the release 1.1 code the release 2 migrations and the rollback probe
        run: |
          for f in migrations/*.sql; do
            if [ ! -e "release-1.1/$f" ]; then cp "$f" "release-1.1/$f"; echo "added $f"; fi
          done
          mkdir -p release-1.1/test/rollback
          cp test/rollback/*.test.ts release-1.1/test/rollback/
          ls release-1.1/migrations
      - name: AT-14a release 1.1 code on the release 2 database shows a guardian nothing, shows nobody a mark, exposes nothing, writes and deletes nothing
        working-directory: release-1.1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/support/github-reporter.mjs --test-reporter-destination=stdout test/rollback/old-code.test.ts
      - name: AT-14a release 1.1 suite on the release 2 database - AT-1
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at1
      - name: AT-14a release 1.1 suite on the release 2 database - AT-4
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at4
      - name: AT-14a release 1.1 suite on the release 2 database - AT-3
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at3
      - name: AT-14a release 1.1 suite on the release 2 database - AT-2
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at2
      - name: AT-14a release 1.1 suite on the release 2 database - AT-5
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at5
      - name: AT-14a release 1.1 suite on the release 2 database - AT-6 and its guards
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at6 && npm run test:guard:end-access && npm run test:guard:end-access-followups
      - name: AT-14a release 1.1 suite on the release 2 database - AT-7 and its guard
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at7 && npm run test:guard:unassign
      - name: AT-14a release 1.1 suite on the release 2 database - AT-8 and its guard
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:at8 && npm run test:guard:removed
      - name: AT-14a release 1.1 suite on the release 2 database - release 1 guards
        if: success() || failure()
        working-directory: release-1.1
        run: npm run test:guard:roles && npm run test:guard:reset && npm run test:guard:doors && npm run test:guard:cross-origin && npm run test:guard:bounds
      - name: Upload evidence (release 1.1 suite on the release 2 database)
        if: always() && hashFiles('release-1.1/evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-rollback
          path: release-1.1/evidence/
