  # LMS wave 8, W8-1a (product-contract v2 on PIL-299): teachers set chapter opening dates. AT-5.1 compares every
  # learner-side response of a world with no date, or with every date passed, with the stored fixtures of main
  # a41f7d8 (pinned), which is checked out beside this commit and recaptured in the same process.
  # W8-1b: learners, guardians and the preview meet the dates (AT-2 to AT-4, AT-5.2, AT-5.4, UX-88 to UX-91, UX-93).
  wave-8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
      LMS_TEST_RUNTIME: in-process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Read the Playwright version
        id: playwright
