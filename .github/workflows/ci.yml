# Trusted test location: every push to main and every pull request is tested
# on a fresh GitHub runner from a clean checkout. The Builder cannot change
# the results here; the Verifier judges from these results alone.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (lockfile only, when present)
        run: if [ -f package-lock.json ]; then npm ci; fi
      # The Builder adds one named step per acceptance test ("AT-1 ...",
      # "AT-5 ...") so the Verifier can see each result in the GitHub UI.
      - name: Test
        run: npm test
      - name: Upload evidence (screenshots, reports)
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
