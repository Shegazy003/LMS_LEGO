<style>
/* Layout: one-screen phone app (school header / scrolling body / bottom bar); at 960px+ (container query)
   the bottom bar becomes a header nav and pages use two or three columns. LMS reset step 3, v1. */
:root {
  color-scheme: light;
  --page: #DDE2EA;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --r-s: 10px; --r-m: 16px; --r-l: 22px;
  --late: #B42318; --late-bg: #FDECEA; --soon: #9A5B00; --soon-bg: #FFF4DE; --done: #1E7B45; --done-bg: #E6F4EC;
  --lock: #4F5A6B; --lock-bg: #EEF0F4; --date: #3949AB; --date-bg: #ECEEFB;
  --mark: #C2185B;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--page); font-family: var(--font); font-size: 15px; line-height: 1.65; }
body.framed { display: grid; place-items: center; }

/* Base palette A: cool neutral */
.app { --bg: #F3F5F9; --surface: #FFFFFF; --ink: #19202C; --muted: #566175; --line: #E0E5EE; --soft: #EEF1F6; }
/* Base palette B: warm sand */
.app[data-base="b"] { --bg: #F7F3EC; --surface: #FFFDF9; --ink: #2A251F; --muted: #685F54; --line: #EAE1D3; --soft: #F1EBE0; }

.app {
  position: relative; height: 100%; width: 100%; margin-inline: auto; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--ink); container: app / inline-size;
  /* the school colour vars are set by script: --school, --on-school, --school-strong, --school-tint */
}
body.framed .app { max-width: 400px; height: min(100%, 860px); border-radius: 30px; box-shadow: 0 20px 60px rgba(20,30,50,.25), 0 0 0 10px #1B1F24; }
.app[data-font="tajawal"] { --font: "Tajawal", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; font-family: var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--school-strong); }
:focus-visible { outline: 3px solid var(--school-strong); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; line-height: 1.35; text-wrap: balance; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
[dir="ltr"] .flip { transform: scaleX(-1); }
.tap { transition: transform .12s ease, background-color .15s, box-shadow .15s; }
.tap:active { transform: scale(.97); }
.tbc { border-bottom: 1.5px dashed currentColor; }
.app.marks [data-d] { outline: 2px dashed var(--mark); outline-offset: 2px; position: relative; }
.app.marks [data-d]::before { content: attr(data-d); position: absolute; top: -10px; inset-inline-start: 8px; z-index: 5; background: var(--mark); color: #fff; font: 700 11px/1 var(--font); padding: 3px 6px; border-radius: 99px; }

/* Header (P2): logo, school name on the school colour, account */
.hdr { background: var(--school); color: var(--on-school); padding-block: 10px; display: flex; align-items: center; gap: 10px; z-index: 3; }
.logo { width: 38px; height: 38px; border-radius: 11px; background: var(--surface); color: var(--school-strong); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
.hdr .school { font-weight: 700; font-size: 17px; margin-inline-end: auto; line-height: 1.2; }
.hdr .school small { display: block; font-weight: 500; font-size: 12px; opacity: .9; }
.hdr .icon-btn { color: inherit; }
.icon-btn { position: relative; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; }
.icon-btn:hover { background: rgba(127,127,127,.15); }
.dnav { display: none; }
.preview-bar { display: none; background: var(--date-bg); color: var(--date); font-size: 13px; font-weight: 600; padding-block: 6px; align-items: center; gap: 8px; }
.app.preview .preview-bar { display: flex; }
.preview-bar button { margin-inline-start: auto; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 99px; min-height: 32px; padding: 0 12px; font-weight: 600; }

/* Body */
.mid { position: relative; flex: 1; min-height: 0; display: flex; }
.scr { flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain; }
.wrap { max-width: 1120px; margin-inline: auto; padding-block: 14px 24px; display: grid; gap: 16px; }
.hello h1 { font-size: 21px; font-weight: 700; }
.hello p { margin: 0; color: var(--muted); font-size: 13.5px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; }
.sec-h h2 { font-size: 17px; font-weight: 700; margin-inline-end: auto; }
.link { border: 0; background: none; color: var(--school-strong); font-weight: 600; min-height: 44px; padding: 0 4px; display: inline-flex; align-items: center; gap: 2px; }
.link .ico { width: 16px; height: 16px; }
.card { background: var(--surface); border-radius: var(--r-m); box-shadow: 0 0 0 1px var(--line); }
.muted { color: var(--muted); }

/* Continue hero */
.hero { border-radius: var(--r-l); padding: 16px; color: var(--on-subj); background: var(--subj); display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset-inline-end: -50px; bottom: -70px; width: 190px; height: 190px; border-radius: 50%; background: rgba(255,255,255,.12); pointer-events: none; }
.hero .kick { font-size: 12.5px; font-weight: 600; opacity: .92; display: flex; align-items: center; gap: 6px; }
.hero h2 { font-size: 20px; font-weight: 700; }
.hero p { margin: 0; font-size: 13px; opacity: .92; }
.hero .btn { grid-column: 1 / -1; background: var(--surface); color: var(--subj-strong); }
.ring { position: relative; width: 62px; height: 62px; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
[dir="rtl"] .ring svg { transform: rotate(-90deg) scaleY(-1); }
.ring b { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; }
.ring small { display: block; font-size: 10px; font-weight: 500; opacity: .85; }

.btn { border: 0; border-radius: 12px; min-height: 46px; padding: 0 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-main { background: var(--school-strong); color: #fff; }
.btn-line { background: transparent; color: var(--school-strong); box-shadow: 0 0 0 1.5px var(--school-strong) inset; }
.btn .ico { width: 19px; height: 19px; }
.wide { width: 100%; }

/* Status tags (D7: colour + icon + words) */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 9px 2px 8px; white-space: nowrap; }
.tag .ico { width: 14px; height: 14px; stroke-width: 2.2; }
.tag.late { color: var(--late); background: var(--late-bg); }
.tag.soon { color: var(--soon); background: var(--soon-bg); }
.tag.done { color: var(--done); background: var(--done-bg); }
.tag.lock { color: var(--lock); background: var(--lock-bg); }
.tag.date { color: var(--date); background: var(--date-bg); }
.app.words .tag { background: transparent; color: var(--ink); padding: 0; }
.app.words .tag .ico { display: none; }

/* Due strip */
.due { display: grid; gap: 8px; }
.due-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 0; width: 100%; text-align: start; }
.due-row .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
.due-row .s { font-size: 12px; color: var(--muted); }
.sicon { width: 40px; height: 40px; border-radius: 12px; background: var(--subj-tint); color: var(--subj-strong); display: grid; place-items: center; flex: none; }
.sicon .ico { width: 22px; height: 22px; }

/* Subject cards */
.subjects { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.subj { border: 0; padding: 0; text-align: start; overflow: hidden; display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; align-items: stretch; width: 100%; }
.subj .band { background: var(--subj); }
.subj .body { padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; }
.subj .body .sicon { grid-row: span 2; }
.subj .nm { font-weight: 700; font-size: 16px; }
.subj .tc { font-size: 12.5px; color: var(--muted); }
.subj .side { padding: 10px 12px; display: grid; justify-items: center; align-content: center; gap: 4px; }
.subj .side .ring { width: 52px; height: 52px; }
.subj .go { font-size: 12.5px; font-weight: 700; color: var(--subj-strong); }
.subj .ann { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); padding: 0 14px 10px; display: flex; gap: 6px; align-items: center; border-top: 1px dashed var(--line); padding-top: 8px; }
.subj .ann .ico { width: 15px; height: 15px; flex: none; }

/* Subject page (P3) */
.sband { border-radius: var(--r-l); background: var(--subj); color: var(--on-subj); padding: 16px; display: grid; gap: 10px; }
.sband .top { display: flex; align-items: center; gap: 12px; }
.sband .top .sicon { background: rgba(255,255,255,.22); color: inherit; }
.sband h1 { font-size: 21px; font-weight: 700; }
.sband p { margin: 0; font-size: 13px; opacity: .92; }
.bar { height: 8px; border-radius: 99px; background: rgba(127,127,127,.25); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: currentColor; }
.sband .bar { background: rgba(255,255,255,.3); }
.sband .meta { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; }
.sband .btn { background: var(--surface); color: var(--subj-strong); }
.ann-box { padding: 12px 14px; display: grid; gap: 4px; }
.ann-box b { font-size: 14px; }
.ann-box p { margin: 0; font-size: 13.5px; }
.ann-box small { color: var(--muted); }
.subj-layout { display: grid; gap: 12px; }
.outline { display: none; }
.chap { overflow: hidden; }
.chap > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; min-height: 52px; }
.chap > summary::-webkit-details-marker { display: none; }
.chap > summary h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.chap > summary h3::before { content: "▾"; font-size: 12px; color: var(--muted); transition: transform .2s; }
.chap:not([open]) > summary h3::before { transform: rotate(90deg); }
[dir="ltr"] .chap:not([open]) > summary h3::before { transform: rotate(-90deg); }
.chap .cnt { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chap .bar { grid-column: 1 / -1; height: 6px; color: var(--subj); }
.lessons { list-style: none; margin: 0; padding: 0 6px 8px; display: grid; }
.lrow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: inherit; min-height: 48px; }
a.lrow:hover { background: var(--soft); }
.lrow .st { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); }
.lrow .st.ok { background: var(--done); border-color: var(--done); color: #fff; }
.lrow .st .ico { width: 15px; height: 15px; stroke-width: 2.6; }
.lrow .lt { font-weight: 600; font-size: 14px; }
.lrow .mats { display: flex; gap: 6px; color: var(--muted); margin-top: 2px; }
.lrow .mats .ico { width: 16px; height: 16px; }
.lrow.plain { color: var(--muted); }
.chap.locked { background: var(--soft); box-shadow: 0 0 0 1px var(--line); }
.chap.locked > summary h3 { color: var(--muted); }
.lockline { margin: 0 14px 12px; display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--lock); }
.lockline .ico { width: 18px; height: 18px; margin-top: 2px; }

/* Lesson page (P4) */
.crumb { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.crumb button { border: 0; background: none; color: var(--school-strong); padding: 6px 2px; font-weight: 600; min-height: 36px; }
.lesson-h h1 { font-size: 21px; font-weight: 700; }
.mats-list { display: grid; gap: 10px; }
.mat { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px; border: 0; width: 100%; text-align: start; }
.mat .mi { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; }
.mat .mi .ico { width: 24px; height: 24px; }
.mat .mt { font-weight: 600; }
.mat .ms { font-size: 12.5px; color: var(--muted); }
.mi.pdf { background: #FDECEA; color: #A8261A; } .mi.video { background: #E8EEFD; color: #2445A8; } .mi.link { background: #E6F5F3; color: #0F6B5E; }
.mi.note { background: #FFF4DE; color: #8A5300; } .mi.image { background: #F2E9FB; color: #6A3AA0; } .mi.quiz { background: #E6F4EC; color: #1E6B3F; }
.note-block { padding: 14px; font-size: 14.5px; line-height: 1.8; border-inline-start: 4px solid var(--subj); }
.vid { aspect-ratio: 16 / 9; border-radius: var(--r-m); background: linear-gradient(135deg, #22324F, #3A5277); display: grid; place-items: center; color: #fff; max-width: 100%; }
.vid .play { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; }
.vid small { margin-top: 6px; opacity: .85; }
.done-toggle { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; width: 100%; text-align: start; min-height: 60px; }
.done-toggle .box { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center; flex: none; }
.done-toggle[aria-pressed="true"] .box { background: var(--done); border-color: var(--done); color: #fff; }
.done-toggle[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--done); }
.done-toggle b { display: block; }
.done-toggle small { color: var(--muted); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager .next { grid-column: 1 / -1; min-height: 54px; font-size: 16px; }

/* Lists: to-do (P8), results (P9) */
.group-h { font-size: 13.5px; font-weight: 700; color: var(--muted); margin: 6px 0 2px; display: flex; align-items: center; gap: 6px; }
.result { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; }
.result .score { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1; text-align: center; }
.result .score small { font-size: 13px; font-weight: 600; color: var(--muted); }
.result .rt { font-weight: 600; }

/* Quiz (P7) */
.qcard { padding: 16px; display: grid; gap: 12px; }
.qcount { font-size: 13px; color: var(--muted); font-weight: 600; }
.qcard h2 { font-size: 18px; font-weight: 700; }
.choice { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; box-shadow: 0 0 0 1.5px var(--line) inset; min-height: 52px; cursor: pointer; }
.choice input { width: 20px; height: 20px; accent-color: var(--school-strong); margin: 0; }
.choice:has(input:checked) { box-shadow: 0 0 0 2px var(--school-strong) inset; background: var(--school-tint); }
.big-score { font-size: 44px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }

/* Sign-in (P1) */
.signin { min-height: 100%; display: grid; align-content: start; }
.signin .top { background: var(--school); color: var(--on-school); padding-block: 36px 52px; text-align: center; display: grid; justify-items: center; gap: 10px; }
.signin .top .logo { width: 64px; height: 64px; font-size: 28px; border-radius: 18px; }
.signin .top h1 { font-size: 22px; }
.signin form { margin: -32px auto 0; width: min(100% - 32px, 420px); padding: 18px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; font-size: 13.5px; font-weight: 600; }
.field input { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 12px; font-weight: 400; }
.field input:focus { outline: none; border-color: var(--school-strong); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

/* Guardian (P12) */
.child { padding: 14px; display: grid; gap: 12px; }
.child .who { display: flex; align-items: center; gap: 12px; }
.child .av { width: 46px; height: 46px; border-radius: 50%; background: var(--school-tint); color: var(--school-strong); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.child .who b { font-size: 16px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--soft); border-radius: 12px; padding: 10px; text-align: center; display: grid; gap: 2px; }
.kpi b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { font-size: 11.5px; color: var(--muted); font-weight: 600; }

/* Empty states (P11) */
.empty { padding: 26px 18px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.empty .disc { width: 76px; height: 76px; border-radius: 50%; background: var(--school-tint); color: var(--school-strong); display: grid; place-items: center; }
.empty .disc .ico { width: 36px; height: 36px; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }

/* Chapter finished (P5) */
.cele { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(20,24,32,.45); padding: 20px; animation: fade .2s ease; }
.cele .card { width: min(100%, 380px); padding: 22px 18px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.cele .burst { width: 84px; height: 84px; border-radius: 50%; background: var(--done-bg); color: var(--done); display: grid; place-items: center; animation: pop .45s ease; }
.cele .burst .ico { width: 42px; height: 42px; stroke-width: 2.4; }
.cele h2 { font-size: 20px; }
.cele p { margin: 0; color: var(--muted); }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes fade { from { opacity: 0; } }
.toast { position: absolute; top: 10px; inset-inline: 12px; z-index: 8; background: var(--ink); color: var(--surface); border-radius: 14px; padding: 10px 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: 440px; margin-inline: auto; animation: fade .2s; display: flex; gap: 8px; align-items: center; }

/* Bottom bar */
.bb { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); z-index: 3; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bb button { position: relative; border: 0; background: none; min-height: 60px; display: grid; justify-items: center; align-content: center; gap: 1px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.bb button[aria-current="true"] { color: var(--school-strong); }
.bb button[aria-current="true"]::before { content: ""; position: absolute; top: 0; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--school-strong); }
.bb .dot { position: absolute; top: 8px; inset-inline-end: calc(50% - 20px); min-width: 18px; height: 18px; border-radius: 99px; background: var(--late); color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 4px; }

/* Sheet + prototype panel (not part of the product) */
.scrim { position: absolute; inset: 0; background: rgba(15,20,28,.42); z-index: 10; opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
.scrim.on { opacity: 1; visibility: visible; }
.sheet { position: absolute; inset-inline: 0; bottom: 0; z-index: 11; max-height: 88%; overflow-y: auto; background: #fff; color: #1F2426; border-radius: 22px 22px 0 0; padding: 8px 16px 18px; transform: translateY(105%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility .28s; }
.sheet.open { transform: none; visibility: visible; }

    <div class="card child"><div class="who"><span class="av">س</span><div><b>سلمى أحمد</b><br><small class="muted">${k.learner} · salma.ahmed</small></div></div></div>
    <div class="card" style="padding:14px;display:grid;gap:10px"><b>${t.language}</b><div class="seg"><button data-act="lang" data-lang="ar" aria-pressed="${S.lang === "ar"}">العربية</button><button data-act="lang" data-lang="en" aria-pressed="${S.lang === "en"}">English</button></div></div>
    <button class="card btn btn-line wide tap" data-act="toast" data-msg="${S.lang === "ar" ? "في النموذج لا تتغير كلمة المرور" : "The prototype does not change passwords"}">${t.changePw}</button>
    <div class="card" style="padding:14px;display:flex;gap:10px;align-items:flex-start"><span style="color:var(--school-strong)">${ico("i-eye")}</span><p style="margin:0;font-size:13.5px"><span class="tbc">${t.guardianNote}</span></p></div>
    <button class="link" data-act="go" data-to="signin">${S.lang === "ar" ? "تسجيل الخروج" : "Sign out"}</button></div>`;
}
function vQuiz() {
  const t = T(), q = S.quiz, s = SUBJ[0];
  if (q.sent) { const score = QUIZ.reduce((a, x, i) => a + (q.a[i] === x[2] ? 1 : 0), 0);
    return `<div class="wrap gut" style="${subjVars(s.color)};max-width:560px"><div class="card qcard" style="text-align:center"><span class="qcount">${t.quizT}</span><h2>${t.yourScore}</h2><div class="big-score">${score} / ${QUIZ.length}</div><button class="btn btn-main tap" data-act="go" data-to="l-m1l4">${t.backToLesson}</button></div></div>`; }
  const [qt, ch] = QUIZ[q.i];
  return `<div class="wrap gut" style="${subjVars(s.color)};max-width:560px"><div class="crumb"><button data-act="go" data-to="l-m1l4">${esc(t.quizT)}</button></div>
    <div class="card qcard"><span class="qcount">${t.qOf(q.i + 1, QUIZ.length)}</span><div class="bar" style="color:var(--school-strong)"><i style="width:${((q.i + 1) / QUIZ.length) * 100}%"></i></div><h2 dir="auto">${esc(qt)}</h2>
      ${ch.map((c, i) => `<label class="choice"><input type="radio" name="q" data-act="answer" value="${i}" ${q.a[q.i] === i ? "checked" : ""}><span dir="ltr">${esc(c)}</span></label>`).join("")}
      ${q.confirm ? `<div class="card" style="padding:12px;display:grid;gap:8px;box-shadow:0 0 0 2px var(--school-strong)"><p style="margin:0">${t.confirmSubmit}</p><div class="pager"><button class="btn btn-main tap" data-act="submitYes">${t.yesSubmit}</button><button class="btn btn-line tap" data-act="submitNo">${t.cancel}</button></div></div>` : ""}
      <div class="pager">${q.i < QUIZ.length - 1 ? `<button class="btn btn-main tap" data-act="qnext">${t.nextQ}</button>` : `<button class="btn btn-main tap" data-act="qsubmit">${t.submit}</button>`}${q.i > 0 ? `<button class="btn btn-line tap" data-act="qprev">${t.prevQ}</button>` : "<span></span>"}</div></div></div>`;
}
function vGuardian() {
  const t = T();
  const kids = [["سلمى أحمد", "س", "17 / 20", "اختبار الشهر: الكسور", "8/10 · 9/10", 2, true], ["يوسف أحمد", "ي", "14 / 15", "Vocabulary quiz", "7/10", 1, false]];
  return `<div class="wrap gut"><h1 style="font-size:21px">${t.guardianT}</h1><div class="cards-2" style="display:grid;gap:12px">${kids.map(([n, a, r, rn, q, d, act]) => `<div class="card child"><div class="who"><span class="av">${a}</span><div><b>${n}</b><br><small class="muted">${K().space}</small></div></div>
    <div class="kpis"><div class="kpi"><b dir="ltr">${r}</b><span>${t.lastResult}</span></div><div class="kpi"><b dir="ltr">${q}</b><span>${t.quizzes}</span></div><div class="kpi"><b>${d}</b><span>${t.dueCount}</span></div></div>
    <p class="hint">${esc(rn)}</p>${act ? `<p class="hint">${ico("i-clock")} <span class="tbc">${t.activity}</span></p>` : ""}</div>`).join("")}</div><p class="hint">${t.fact}</p></div>`;
}

/* ---------- chrome ---------- */
function renderChrome(route) {
  const t = T(), k = K();
  const cur = route.startsWith("s-") || route.startsWith("l-") || route === "subjects" || route === "quiz" ? "subjects" : ["home", "todo", "results", "account"].includes(route) ? route : "home";
  const lateN = dueItems().filter(i => !i.done && i.n < 0).length;
  const items = S.view === "guardian" ? [["guardian", "i-home", t.home], ["account", "i-user", t.account]] : [["home", "i-home", t.home], ["subjects", "i-books", k.subjects], ["todo", "i-list", t.todo], ["results", "i-chart", t.results], ["account", "i-user", t.account]];
  $("#hdr").innerHTML = route === "signin" ? "" : `<span class="logo">${k.space.trim()[0]}</span><span class="school" data-d="D2">${k.space}<small>${S.view === "guardian" ? (S.lang === "ar" ? "بوابة وليّ الأمر" : "Guardian portal") : k.spaceSub}</small></span>
    <nav class="dnav">${items.map(([r, , l]) => `<button data-act="go" data-to="${r}" aria-current="${cur === r || (S.view === "guardian" && r === "guardian" && route === "guardian")}">${l}</button>`).join("")}</nav>
    <button class="icon-btn tap" data-act="go" data-to="account" aria-label="${t.account}">${ico("i-user")}</button>`;
  $("#hdr").hidden = route === "signin";
  $("#pbar").innerHTML = `${ico("i-eye")}<span>${t.previewing}</span><button data-act="exitPreview">${t.exitPreview}</button>`;
  $("#bb").hidden = route === "signin";
  $("#bb").style.gridTemplateColumns = `repeat(${items.length},1fr)`;
  $("#bb").innerHTML = items.map(([r, i, l]) => `<button class="tap" data-act="go" data-to="${r}" aria-current="${cur === r || (r === "guardian" && route === "guardian")}">${ico(i)}${r === "todo" && lateN && !S.empty ? `<span class="dot">${lateN}</span>` : ""}<span>${l}</span></button>`).join("");
  $("#fabtxt").textContent = t.proto;
}
function applyLook() {
  const app = $("#app"), sc = SCHOOLS[S.school];
  app.dataset.base = S.base; app.dataset.font = S.font; app.dir = S.lang === "ar" ? "rtl" : "ltr"; app.lang = S.lang;
  app.style.setProperty("--school", sc); app.style.setProperty("--on-school", onColor(sc)); app.style.setProperty("--school-strong", strong(sc)); app.style.setProperty("--school-tint", tint(sc, .88));
  app.classList.toggle("marks", S.marks); app.classList.toggle("preview", S.preview); document.body.classList.toggle("framed", S.frame);
  document.documentElement.lang = S.lang;
}
const route = () => (location.hash || "#home").slice(1) || "home";
function view(r) {
  if (S.view === "guardian" && !["account", "signin"].includes(r)) return vGuardian();
  if (r === "signin") return vSignin();
  if (r === "home") return vHome();
  if (r === "subjects") return vSubjects();
  if (r.startsWith("s-")) return vSubject(r.slice(2));
  if (r.startsWith("l-")) return vLesson(r.slice(2));
  if (r === "todo") return vTodo();
  if (r === "results") return vResults();
  if (r === "account") return vAccount();
  if (r === "quiz") return vQuiz();
  if (r === "guardian") return vGuardian();
  return vHome();
}
function refresh(top) { const sc = $("#scr"), keep = sc.scrollTop; applyLook(); const r = route(); renderChrome(r); sc.innerHTML = view(r); sc.scrollTop = top ? 0 : keep; }
function go(to) { if ("#" + to === location.hash) refresh(true); else location.hash = to; }
window.addEventListener("hashchange", () => { closeSheet(); refresh(true); $("#scr").focus({ preventScroll: true }); });

let toastT;
function toast(msg) { const h = $("#toastHost"); h.innerHTML = `<div class="toast" role="status">${ico("i-check")}<span>${esc(msg)}</span></div>`; clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ""; }, 2600); }
function celebrate(s, c) {
  const t = T(), idx = s.chapters.indexOf(c), nc = s.chapters[idx + 1], pr = prog(s);
  $("#cele").innerHTML = `<div class="cele" role="dialog" aria-modal="true" aria-labelledby="celeT" style="${subjVars(s.color)}" data-d="D5"><div class="card"><span class="burst">${ico("i-star")}</span><h2 id="celeT">${t.wellDone(c.name)}</h2><p>${t.wellDoneS}</p>
    <div style="width:100%;display:grid;gap:4px"><div class="bar" style="color:var(--subj)"><i style="width:${pr.p * 100}%"></i></div><small class="muted">${s.name} · ${t.lessonsOf(pr.d, pr.n)}</small></div>
    ${nc ? `<button class="btn btn-main wide tap" data-act="celeGo" data-to="s-${s.id}">${t.nextChapter}: ${esc(nc.name)}</button>` : ""}<button class="btn btn-line wide tap" data-act="celeGo" data-to="s-${s.id}">${t.backToSubject}</button></div></div>`;
  setTimeout(() => { const b = $("#cele button"); b && b.focus(); }, 50);
}

/* ---------- prototype panel ---------- */
function protoPanel() {
  const ar = S.lang === "ar";
  const tx = ar ? { t: "لوحة النموذج", s: "ليست جزءًا من المنصة. جرّب الألوان والخطوط، وتنقّل بين الشاشات P1–P15.", base: "الخلفية", school: "لون المدرسة (D2)", font: "الخط العربي (D4)", lang: "اللغة", kit: "نوع المساحة", view: "عرض", opts: "خيارات", preview: "إطار المعاينة (P13)", previewS: "كما يرى المعلّم صفحة الطالب", empty: "حالات فارغة (P11)", emptyS: "طالب بلا موادّ، لا شيء مطلوب", marks: "إظهار علامات القرارات", marksS: "خط متقطع حيث تنطبق D2–D7", frame: "إطار الهاتف", frameS: "على الكمبيوتر: اعرض بعرض الهاتف", scr: "الشاشات", reset: "إعادة التقدّم إلى البداية", note: "خط متقطع تحت النص = صياغة تنتظر موافقتك." }
    : { t: "Prototype panel", s: "Not part of the product. Try colours and typefaces, and jump between screens P1–P15.", base: "Background", school: "School colour (D2)", font: "Arabic typeface (D4)", lang: "Language", kit: "Space type", view: "View", opts: "Options", preview: "Preview frame (P13)", previewS: "How a teacher sees the student page", empty: "Empty states (P11)", emptyS: "Student with no subjects, nothing due", marks: "Show decision markers", marksS: "Dashed outline where D2–D7 apply", frame: "Phone frame", frameS: "On a computer: show at phone width", scr: "Screens", reset: "Reset progress to the start", note: "Dashed underline = wording waiting for your approval." };
  const seg = (act, key, opts) => `<div class="seg">${opts.map(([v, l, sw]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${S[key] === v}">${sw ? `<i style="background:${sw}"></i>` : ""}${l}</button>`).join("")}</div>`;
  const screens = [["P1", ar ? "الدخول" : "Sign-in", "signin"], ["P2", ar ? "الرئيسية" : "Home", "home"], ["P3", ar ? "صفحة المادّة" : "Subject page", "s-math"], ["P4", ar ? "صفحة الدرس" : "Lesson page", "l-m1l3"], ["P5", ar ? "أنهيت الفصل" : "Chapter finished", "@cele"], ["P6", ar ? "درس مغلق" : "Locked lesson", "l-m3l1"], ["P7", ar ? "اختبار قصير" : "Quiz", "quiz"], ["P8", ar ? "المطلوب" : "To do", "todo"], ["P9", ar ? "نتائجي" : "Results", "results"], ["P10", ar ? "حسابي" : "Account", "account"], ["P11", ar ? "حالات فارغة" : "Empty states", "@empty"], ["P12", ar ? "وليّ الأمر" : "Guardian", "@guardian"], ["P13", ar ? "إطار المعاينة" : "Preview frame", "@preview"], ["P14", ar ? "شاشة الكمبيوتر" : "Computer screen", "@desktop"], ["P15", ar ? "الألوان" : "Colours", "@colours"]];
  return `<div class="grab"></div><div class="proto"><div><h2>${tx.t}</h2><p class="tagline">${tx.s}</p></div>
    <fieldset><legend>${tx.school}</legend>${seg("school", "school", [["orange", ar ? "برتقالي فاتح" : "Light orange", SCHOOLS.orange], ["blue", ar ? "أزرق" : "Blue", SCHOOLS.blue], ["green", ar ? "أخضر" : "Green", SCHOOLS.green]])}</fieldset>
    <fieldset><legend>${tx.base}</legend>${seg("base", "base", [["a", ar ? "أ. محايد بارد" : "A. Cool neutral", "#F3F5F9"], ["b", ar ? "ب. رملي دافئ" : "B. Warm sand", "#F7F3EC"]])}</fieldset>
    <fieldset><legend>${tx.font}</legend>${seg("font", "font", [["plex", "IBM Plex Sans Arabic"], ["tajawal", "Tajawal"]])}</fieldset>
    <fieldset><legend>${tx.lang}</legend>${seg("lang2", "lang", [["ar", "العربية"], ["en", "English"]])}</fieldset>
    <fieldset><legend>${tx.kit}</legend>${seg("kit", "kit", [["school", ar ? "مدرسة" : "School"], ["company", ar ? "شركة" : "Company"]])}</fieldset>
    <fieldset><legend>${tx.view}</legend>${seg("viewAs", "view", [["learner", ar ? "طالب" : "Student"], ["guardian", ar ? "وليّ أمر" : "Guardian"]])}</fieldset>
    <fieldset><legend>${tx.opts}</legend>
      <label class="tog" for="t-preview"><span>${tx.preview}<small>${tx.previewS}</small></span><input id="t-preview" type="checkbox" data-tog="preview" ${S.preview ? "checked" : ""}></label>
      <label class="tog" for="t-empty"><span>${tx.empty}<small>${tx.emptyS}</small></span><input id="t-empty" type="checkbox" data-tog="empty" ${S.empty ? "checked" : ""}></label>
      <label class="tog" for="t-marks"><span>${tx.marks}<small>${tx.marksS}</small></span><input id="t-marks" type="checkbox" data-tog="marks" ${S.marks ? "checked" : ""}></label>
      <label class="tog" for="t-frame"><span>${tx.frame}<small>${tx.frameS}</small></span><input id="t-frame" type="checkbox" data-tog="frame" ${S.frame ? "checked" : ""}></label></fieldset>
    <fieldset><legend>${tx.scr}</legend><div class="screens">${screens.map(([n, l, to]) => `<button class="tap" data-act="screen" data-to="${to}"><b>${n}</b>${l}</button>`).join("")}</div></fieldset>
    <button class="btn btn-dark tap" data-act="resetProg">${tx.reset}</button><p class="tagline">${tx.note}</p></div>`;
}
function openSheet(html) { $("#sheet").innerHTML = html; $("#sheet").classList.add("open"); $("#scrim").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("open"); $("#scrim").classList.remove("on"); }
const rePanel = () => { refresh(); $("#sheet").innerHTML = protoPanel(); };

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case "go": e.preventDefault(); go(el.dataset.to); break;
    case "jump": { const t = document.getElementById(el.dataset.to); if (t) { if (t.tagName === "DETAILS") t.open = true; t.scrollIntoView({ behavior: "smooth", block: "start" }); } break; }
    case "toast": toast(el.dataset.msg); break;
    case "toggleDone": {
      const id = el.dataset.id, f = findLesson(id), was = isDone(id);
      S.done = was ? S.done.filter(x => x !== id) : [...S.done, id]; save(); refresh();
      if (!was && chapterDone(f.c)) celebrate(f.s, f.c); else if (!was) toast(T().markedDone);
      break;
    }
    case "celeGo": $("#cele").innerHTML = ""; go(el.dataset.to); break;
    case "lang": S.lang = el.dataset.lang; save(); refresh(); break;
    case "qnext": if (S.quiz.a[S.quiz.i] == null) { toast(S.lang === "ar" ? "اختر إجابة أولًا" : "Choose an answer first"); break; } S.quiz.i++; refresh(); break;
    case "qprev": S.quiz.i--; refresh(); break;
    case "qsubmit": if (S.quiz.a[S.quiz.i] == null) { toast(S.lang === "ar" ? "اختر إجابة أولًا" : "Choose an answer first"); break; } S.quiz.confirm = true; refresh(); break;
    case "submitNo": S.quiz.confirm = false; refresh(); break;
    case "submitYes": S.quiz.sent = true; S.quiz.confirm = false; refresh(true); break;
    case "exitPreview": S.preview = false; save(); refresh(); break;
    case "proto": openSheet(protoPanel()); break;
    case "closeSheet": closeSheet(); break;
    case "school": S.school = el.dataset.v; save(); rePanel(); break;
    case "base": S.base = el.dataset.v; save(); rePanel(); break;
    case "font": S.font = el.dataset.v; save(); rePanel(); break;
    case "lang2": S.lang = el.dataset.v; save(); rePanel(); break;
    case "kit": S.kit = el.dataset.v; save(); rePanel(); break;
    case "viewAs": S.view = el.dataset.v; save(); if (S.view === "guardian") location.hash = "guardian"; else if (route() === "guardian") location.hash = "home"; rePanel(); break;
    case "resetProg": S.done = START_DONE.slice(); S.quiz = { i: 0, a: {}, sent: false, confirm: false }; save(); rePanel(); break;
    case "screen": {
      const to = el.dataset.to; closeSheet();
      if (S.view === "guardian" && to !== "@guardian") { S.view = "learner"; save(); }
      if (to === "@cele") { const s = SUBJ[1], c = s.chapters[0]; go("s-sci"); setTimeout(() => celebrate(s, c), 250); }
      else if (to === "@empty") { S.empty = true; save(); go("home"); }
      else if (to === "@guardian") { S.view = "guardian"; save(); go("guardian"); }
      else if (to === "@preview") { S.preview = true; save(); go("s-math"); }
      else if (to === "@desktop") { S.frame = false; save(); go("s-math"); toast(S.lang === "ar" ? "افتح الرابط على الكمبيوتر بعرض الشاشة كاملًا" : "Open the link on a computer at full width"); }
      else if (to === "@colours") { S.school = "orange"; save(); go("home"); setTimeout(() => openSheet(protoPanel()), 250); }
      else { if (S.empty && to !== "signin") { S.empty = false; save(); } if (to === "quiz") S.quiz = { i: 0, a: {}, sent: false, confirm: false }; go(to); }
      break;
    }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "answer") { S.quiz.a[S.quiz.i] = Number(el.value); return; }
  if (el.dataset.tog) { S[el.dataset.tog] = el.checked; save(); refresh(); }
});
document.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "signinForm") go("home"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); $("#cele").innerHTML = ""; } });

refresh(true);
})();
</script>
